    archiveVersion = '1.0'
    
    from sourceSets.main.output
    from sourceSets.drivers.output
    
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    manifest {
        attributes 'Main-Class': 'edu.upc.prop.clusterxx.controladors.CtrlRespostaDriver'
    }
    
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

task jarCtrlAnalisiDriver(type: Jar) {
    group = 'drivers'
    description = 'Genera JAR ejecutable para CtrlAnalisiDriver'
    archiveBaseName = 'CtrlAnalisiDriver'
    archiveVersion = '1.0'
    
    from sourceSets.main.output
    from sourceSets.drivers.output
    
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
