plugins {
    id 'java'
    id 'application'
}

group = 'edu.upc.prop.clusterxx'
version = '1.0-SNAPSHOT'

// Define los source sets correctamente
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
    drivers {
        java {
            srcDirs = ['src/drivers/java']

        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

ext {
    javaMainClass = 'edu.upc.prop.clusterxx.controladors.CtrlEnquestaDriver'
}

application {
    mainClass = javaMainClass
}

jar {
    manifest {
        attributes 'Main-Class': javaMainClass
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'org.json:json:20231013'
    testImplementation 'junit:junit:4.13.1'
    
    // Añadir las dependencias también al sourceset drivers
    driversImplementation 'com.google.code.gson:gson:2.8.9'
    driversImplementation 'org.json:json:20231013'
}

// Tareas para ejecutar drivers



task runCtrlEnquestaDriver(type: JavaExec) {
    group = 'drivers'
    description = 'Ejecuta el CtrlEnquestaDriver'
    classpath = sourceSets.drivers.runtimeClasspath
    mainClass = 'edu.upc.prop.clusterxx.controladors.CtrlEnquestaDriver'
    standardInput = System.in
}

task runCtrlUsuariDriver(type: JavaExec) {
    group = 'drivers'
    description = 'Ejecuta el CtrlUsuariDriver'
    classpath = sourceSets.drivers.runtimeClasspath
    mainClass = 'edu.upc.prop.clusterxx.controladors.CtrlUsuariDriver'
    standardInput = System.in
}

task runCtrlRespostaDriver(type: JavaExec) {
    group = 'drivers'
    description = 'Ejecuta el CtrlRespostaDriver'
    classpath = sourceSets.drivers.runtimeClasspath
    mainClass = 'edu.upc.prop.clusterxx.controladors.CtrlRespostaDriver'
    standardInput = System.in
}

task runCtrlAnalisiDriver(type: JavaExec) {
    group = 'drivers'
    description = 'Ejecuta el CtrlAnalisiDriver'
    classpath = sourceSets.drivers.runtimeClasspath
    mainClass = 'edu.upc.prop.clusterxx.controladors.CtrlAnalisiDriver'
    standardInput = System.in
}

// Tareas para generar JARs de drivers

task jarCtrlEnquestaDriver(type: Jar) {
    group = 'drivers'
    description = 'Genera JAR ejecutable para CtrlEnquestaDriver'
    archiveBaseName = 'CtrlEnquestaDriver'
    archiveVersion = '1.0'
    
    from sourceSets.main.output
    from sourceSets.drivers.output
    
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    manifest {
        attributes 'Main-Class': 'edu.upc.prop.clusterxx.controladors.CtrlEnquestaDriver'
    }
    
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

