plugins {
    id 'java'
    id 'application'
}

group = 'edu.upc.prop.clusterxx'
version = '1.0-SNAPSHOT'

// Define los source sets correctamente
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
    drivers {
        java {
            srcDirs = ['src/drivers/java']
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

ext {
    javaMainClass = 'edu.upc.prop.clusterxx.MainDriver'
}

application {
    mainClass = javaMainClass
}

jar {
    manifest {
        attributes 'Main-Class': javaMainClass
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'org.json:json:20231013'
    testImplementation 'junit:junit:4.13.1'
}

// Tareas para ejecutar drivers


task runCtrlDominiDriver(type: JavaExec) {
    group = 'drivers'
    description = 'Ejecuta el CtrlDominiDriver'
    classpath = sourceSets.drivers.runtimeClasspath
    mainClass = 'edu.upc.prop.clusterxx.controladors.CtrlDominiDriver'
    standardInput = System.in
}

