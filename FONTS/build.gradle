// Tarea para generar todos los JARs de drivers
task jarAllDrivers {
    group = 'drivers'
    description = 'Genera todos los JARs ejecutables de drivers'
    dependsOn jarCtrlEnquestaDriver, jarCtrlUsuariDriver, jarCtrlRespostaDriver, jarCtrlAnalisiDriver
}


